spring:
  # ==============================
  # 🗄️ Database (Development)
  # ==============================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tba_waad_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres} # Default for local dev only
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # ==============================
  # 🧠 JPA / Hibernate (Development)
  # ==============================
  jpa:
    hibernate:
      ddl-auto: create-drop # Recreate schema to fix column mismatch
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  # ==============================
  # 🚀 Flyway (Development)
  # ==============================
  flyway:
    enabled: false
    validate-on-migrate: false
    clean-disabled: false

# ==============================
# 🌐 Server (Development)
# ==============================
server:
  servlet:
    session:
      cookie:
        secure: false # HTTP allowed in dev

# ==============================
# 🔐 JWT (Development)
# ==============================
jwt:
  secret: ${JWT_SECRET:v2_waad_tba_system_secure_stateless_secret_key_2026_stabilization}
  expiration: 86400000

# ==============================
# 🔒 Security (Development)
# ==============================
app:
  security:
    require-email-verification: false

  frontend:
    cors:
      allowed-origins: http://localhost:3000,http://localhost:5174

# ==============================
# 📘 Swagger (Development - ENABLED)
# ==============================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ==============================
# 📊 Logging (Development)
# ==============================
logging:
  level:
    com.waad.tba: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# ==============================
# 🧠 Caching (Development)
# ==============================
spring:
  cache:
    type: jcache

# ==============================
# 🚦 Rate Limiting (Development)
# ==============================
bucket4j:
  enabled: true
  cache-to-use: jcache
  filters:
    - cache-name: rate-limit-bucket
      url: /api/auth/login
      strategy: first
      rate-limits:
        - bandwidths:
            - capacity: 100 # Relaxed for dev
              time: 1
              unit: minutes

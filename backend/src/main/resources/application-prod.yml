spring:
  # ==============================
  # 🗄️ Database (Production)
  # ==============================
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  # ==============================
  # 🧠 JPA / Hibernate (Production)
  # ==============================
  jpa:
    hibernate:
      ddl-auto: validate  # ✅ NEVER use 'update' in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ==============================
  # 🚀 Flyway (Production)
  # ==============================
  flyway:
    enabled: true
    validate-on-migrate: true  # ✅ Validate migrations before applying
    clean-disabled: true       # ✅ Prevent accidental data loss

# ==============================
# 🌐 Server (Production)
# ==============================
server:
  servlet:
    session:
      cookie:
        secure: true  # ✅ HTTPS only
        same-site: strict

# ==============================
# 🔐 JWT (Production)
# ==============================
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# ==============================
# 🔒 Security (Production)
# ==============================
app:
  security:
    require-email-verification: true
    max-failed-login-attempts: 5
  
  frontend:
    url: ${FRONTEND_URL}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

# ==============================
# 📘 Swagger (Production - DISABLED)
# ==============================
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ==============================
# 📊 Logging (Production)
# ==============================
logging:
  level:
    com.waad.tba: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR

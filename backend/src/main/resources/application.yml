spring:
  application:
    name: tba-waad-system-backend

  # ==============================  # 🌐 Server & Encoding
  # ==============================
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # ==============================
  # 🆔 Member Card Number Configuration
  # ==============================
  # Format placeholders:
  # {R}    : Relationship Code (P=Principal, S=Spouse, C=Child, D=Dependent)
  # {PRO}  : Provider Code (3 letters from Insurance Org)
  # {COMP} : Company Code (3 letters from Employer Org)
  # {ID}   : Unique Identifier (6+ digits)
  # Examples:
  # - Standard: {R}-{PRO}-{COMP}-{ID}  (e.g., P-TBA-WAAD-001234)
  # - Company First: {COMP}-{ID}-{R}   (e.g., WAAD-001234-P)
  # - Simple: {ID}-{R}                 (e.g., 001234-P)
  tba:
    member:
      card-number-format: "{ًُِWaad}-{year}{employee_id}-{R}"

  # ==============================
  # 📧 Mail Configuration (Hostinger SMTP)
  # ==============================
  mail:
    host: ${EMAIL_HOST:smtp.hostinger.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:support@alwahacare.com}
    password: ${EMAIL_PASSWORD:support_pass} # Default for local dev robustness
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      debug: false
    # Test SMTP connection on startup (set false if you want to skip)
    test-connection: false

  # ==============================
  # 🗄️ Database (Local Windows/Linux)
  # ==============================
  datasource:
    # Docker PostgreSQL uses port 5433, native uses 5432
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tba_waad_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres} # Default for local dev robustness
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TBA-WAAD-HikariPool
      initialization-fail-timeout: -1
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ==============================
  # 🧠 JPA / Hibernate
  # ==============================
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  # ==============================
  # 🚀 Flyway Database Migration
  # ==============================
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
    out-of-order: true
    # 🛡️ SECURITY: Never use clean-disabled=false in production
    clean-disabled: true
    # 📝 Allow migrations to run even if checksum changed (DEV ONLY)
    # For production, always use repair command manually after backup
    ignore-migration-patterns: ${FLYWAY_IGNORE_PATTERNS:}

  # ==============================
  # ⚡ Redis Configuration
  # ==============================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # ==============================
  # 🧠 Caching Configuration
  # ==============================
  cache:
    type: jcache # Using JCache as a bridge between Bucket4j and Caffeine
    cache-names:
      - rate-limit-bucket
      - coverageResolution
      - medicalServices
      - medicalServiceLookups
      - systemSettings
    caffeine:
      spec: expireAfterWrite=1h,maximumSize=1000

# ==============================
# 🌐 Server
# ==============================
server:
  port: 8080
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-stacktrace: ${SERVER_ERROR_INCLUDE_STACKTRACE:never}

  servlet:
    session:
      timeout: 30m # Session expires after 30 minutes of inactivity
      cookie:
        name: JSESSIONID # Default Spring session cookie name
        http-only: true # Prevents XSS attacks (JavaScript cannot access cookie)
        same-site: strict # Prevents CSRF attacks (cookie only sent to same site)
        secure: false # local  Set to 'true' in production (HTTPS only) - false for dev
        max-age: 1800 # 30 minutes in seconds (matches session timeout)

# ==============================
# 🔐 JWT (محفوظ للموبايل)
# ==============================
jwt:
  secret: ${JWT_SECRET:v2_waad_tba_system_secure_stateless_secret_key_2026_stabilization}
  expiration: 86400000

# ==============================
# 🔒 Security Configuration
# ==============================
app:
  security:
    # Initial Super Admin Configuration
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD:Admin@123}
    initial-admin-username: ${INITIAL_ADMIN_USERNAME:superadmin}
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:superadmin@tba.sa}

    # Password reset token validity (in hours)
    password-reset-token-validity-hours: ${PASSWORD_RESET_TOKEN_VALIDITY_HOURS:1}

    # Email verification token validity (in hours)
    email-verification-token-validity-hours: ${EMAIL_VERIFICATION_TOKEN_VALIDITY_HOURS:24}

    # Require email verification before allowing login
    # Set to false in development, true in production
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}

    # Account lockout duration (in minutes)
    account-lockout-duration-minutes: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:30}

    # Maximum failed login attempts before lockout
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}

  # Frontend URL for email links
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

    # CORS Configuration
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  # Email configuration
  email:
    from: ${EMAIL_FROM:support@alwahacare.com}
    from-name: ${EMAIL_FROM_NAME:شركة وعد لإدارة النفقات الطبية}
    # Enable/disable email features
    enabled: ${EMAIL_ENABLED:true}

# ==============================
# 📘 Swagger (Local)
# ==============================
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: false
    display-request-duration: true

# ==============================
# � File Storage Configuration
# ==============================
file:
  storage:
    # Storage type: local, s3, minio
    type: ${FILE_STORAGE_TYPE:local}

    # Local file storage settings
    local:
      base-path: ${FILE_STORAGE_PATH:./uploads}

    # Maximum file sizes (in bytes)
    max-size:
      document: ${MAX_DOCUMENT_SIZE:10485760} # 10MB = 10 * 1024 * 1024
      image: ${MAX_IMAGE_SIZE:52428800} # 50MB = 50 * 1024 * 1024

    # Allowed MIME types
    allowed-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/jpg
      - application/dicom
      - application/x-dicom

# ==============================
# �📊 Logging
# ==============================
logging:
  level:
    com.waad.tba: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ERROR

# ==============================
# 🚦 Rate Limiting (Bucket4j)
# ==============================
bucket4j:
  enabled: ${RATE_LIMITING_ENABLED:true}
  cache-to-use: jcache
  filters:
    - cache-name: rate-limit-bucket
      url: /api/auth/login
      strategy: first
      rate-limits:
        - bandwidths:
            - capacity: 5
              time: 1
              unit: minutes
    - cache-name: rate-limit-bucket
      url: /api/.*
      strategy: first
      rate-limits:
        - bandwidths:
            - capacity: 100
              time: 1
              unit: minutes

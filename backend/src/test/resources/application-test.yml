spring:
  application:
    name: tba-waad-test-backend
  
  datasource:
    url: jdbc:h2:mem:tba_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true

# Mock configurations to prevent bean creation failures
mail:
  host: localhost
  port: 3025
  username: test
  password: test
  test-connection: false

jwt:
  secret: TEST_SECRET_KEY_MUST_BE_AT_LEAST_32_CHARS_LONG_FOR_SHA256
  expiration: 3600000

file:
  storage:
    type: local
    local:
      base-path: target/test-uploads

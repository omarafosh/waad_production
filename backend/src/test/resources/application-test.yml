spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tba_waad_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false

  cache:
    type: simple
    cache-names: rate-limit-bucket,coverageResolution,medicalServices,systemSettings

bucket4j:
  enabled: false

server:
  error:
    include-message: never
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:VGhpcy1pcy1hLUJhc2U2NC1leGFtcGxlLXNlY3JldC0uLi4=}

app:
  security:
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD:Admin@123}
    initial-admin-username: ${INITIAL_ADMIN_USERNAME:superadmin}
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:superadmin@tba.sa}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

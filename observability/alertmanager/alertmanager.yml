global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  receiver: blackhole
  routes:
    - matchers:
        - severity="critical"
      receiver: ops-webhook
      continue: true
    - matchers:
        - severity="warning"
      receiver: ops-webhook

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service"]

receivers:
  - name: blackhole
  - name: ops-webhook
    webhook_configs:
      - url: ${ALERT_WEBHOOK_URL}
        send_resolved: true

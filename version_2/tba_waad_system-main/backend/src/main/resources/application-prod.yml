# ================================================================
# 🚀 Production Profile - STRICT Security & Validation
# ================================================================
# Usage: java -jar -Dspring.profiles.active=prod app.jar
# ================================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db-server:5432/tba_waad_production}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  # NEVER update/create in production
  
  flyway:
    # 🛡️ PRODUCTION: STRICT validation
    validate-on-migrate: true
    clean-disabled: true  # NEVER allow clean in production
    out-of-order: false
    # 🚨 If checksum error occurs:
    # 1. Take DB backup
    # 2. Run: mvn flyway:repair (after investigation)
    # 3. Never modify existing V* files - create new V+1 instead

# ==============================
# 🔒 Security (Production)
# ==============================
server:
  servlet:
    session:
      cookie:
        secure: true  # HTTPS only
        same-site: strict
        http-only: true

# ==============================
# 🔍 Logging (Minimal in Production)
# ==============================
logging:
  level:
    root: WARN
    com.waad.tba: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

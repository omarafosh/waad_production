spring:
  application:
    name: tba-waad-system-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:60MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:60MB}

  # ==============================  # 🌐 Server & Encoding
  # ==============================
  server:
    servlet:
      encoding:
        charset: UTF-8
        enabled: true
        force: true

  # ==============================  # � Main Configuration
  # ==============================
  main:
    allow-circular-references: false  # Circular dependencies should be refactored

  # ==============================
  # 📧 Mail Configuration (Hostinger SMTP)
  # ==============================
  # ⚠️ SECURITY: Credentials validated at startup via StartupSecurityValidator
  # If EMAIL_ENABLED=true (default), EMAIL_USERNAME and EMAIL_PASSWORD MUST be set
  # If EMAIL_ENABLED=false, empty defaults are used (mail service disabled)
  mail:
    host: ${EMAIL_HOST:smtp.hostinger.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      debug: false
    # Test SMTP connection on startup (set false if you want to skip)
    test-connection: false

  # ==============================
  # 🗄️ Database (Local Windows/Linux)
  # ==============================
  # ⚠️ SECURITY: Set DB_PASSWORD via environment variable in production
  datasource:
    # Docker PostgreSQL uses port 5433, native uses 5432
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tba_waad_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TBA-WAAD-HikariPool
      initialization-fail-timeout: -1
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ==============================
  # 🧠 JPA / Hibernate
  # ==============================
  jpa:
    hibernate:
      # ⚠️ CRITICAL: Use 'validate' for production-grade stability
      # Schema MUST be created via Flyway migrations
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        # Enable SQL parameter logging
        use_sql_comments: true
      # ==============================
      # 🔒 Transaction Timeout (Financial Hardening)
      # ==============================
      # Prevents long-running transactions from holding locks indefinitely
      # Critical for financial operations with PESSIMISTIC_WRITE locks
      # 30 seconds should be sufficient for most claim approval/settlement operations
      jakarta:
        persistence:
          lock:
            timeout: 30000  # 30 seconds in milliseconds
  
  # ==============================
  # � Pagination Configuration
  # ==============================
  data:
    web:
      pageable:
        # Maximum page size to prevent OOM attacks
        max-page-size: 100
        # Default page size if not specified
        default-page-size: 20
        # Allow one-indexed parameters (page=1 instead of page=0)
        one-indexed-parameters: false
  
  # ==============================
  # �🚀 Flyway Database Migration
  # ==============================
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: '0'
    locations: classpath:db/migration
    # ⚠️ PRODUCTION: validate-on-migrate must be TRUE
    # 🔧 LOCAL DEV: set to false if you need to repair checksums
    validate-on-migrate: ${FLYWAY_VALIDATE:false}
    out-of-order: true
    # 🛡️ SECURITY: Never use clean-disabled=false in production
    clean-disabled: true
    # 📝 Allow migrations to run even if checksum changed (DEV ONLY)
    # For production, always use repair command manually after backup
    ignore-migration-patterns: ${FLYWAY_IGNORE_PATTERNS:}

# ==============================
# 🌐 Server
# ==============================
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: on_param

  servlet:
    session:
      timeout: 30m                        # Session expires after 30 minutes of inactivity
      cookie:
        name: JSESSIONID                  # Default Spring session cookie name
        http-only: true                   # Prevents XSS attacks (JavaScript cannot access cookie)
        same-site: strict                 # Prevents CSRF attacks (cookie only sent to same site)
        # ⚠️ PRODUCTION: Must set secure=true (HTTPS only)
        # DEV: secure=false allows HTTP for local testing
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: 1800                     # 30 minutes in seconds (matches session timeout)

# ==============================
# 🔐 JWT (محفوظ للموبايل - Reserved for Mobile clients)
# ==============================
# ⚠️ SECURITY: Set JWT_SECRET via environment variable in production (min 32 bytes)
# JWT is NOT used for web authentication (session-based), only for future mobile API
jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-key-for-testing-only-12345678}
  expiration: 86400000

# ==============================
# 🔒 Security Configuration
# ==============================
app:
  security:
    # Password reset token validity (in hours)
    password-reset-token-validity-hours: ${PASSWORD_RESET_TOKEN_VALIDITY_HOURS:1}
    
    # Email verification token validity (in hours)
    email-verification-token-validity-hours: ${EMAIL_VERIFICATION_TOKEN_VALIDITY_HOURS:24}
    
    # Require email verification before allowing login
    # Set to false in development, true in production
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
    
    # Account lockout duration (in minutes)
    account-lockout-duration-minutes: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:30}
    
    # Maximum failed login attempts before lockout
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
  
  # Frontend URL for email links
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  
  # Email configuration
  email:
    from: ${EMAIL_FROM:support@alwahacare.com}
    from-name: ${EMAIL_FROM_NAME:شركة وعد لإدارة النفقات الطبية}
    # Enable/disable email features (set to false for local development)
    enabled: ${EMAIL_ENABLED:false}

# ==============================
# 📘 Swagger (Local)
# ==============================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: false
    display-request-duration: true

# ==============================
# � File Storage Configuration
# ==============================
file:
  storage:
    # Storage type: local, s3, minio
    type: ${FILE_STORAGE_TYPE:local}
    
    # Local file storage settings
    local:
      base-path: ${FILE_STORAGE_PATH:./uploads}
    
    # Maximum file sizes (in bytes)
    max-size:
      document: ${MAX_DOCUMENT_SIZE:10485760}  # 10MB = 10 * 1024 * 1024
      image: ${MAX_IMAGE_SIZE:52428800}        # 50MB = 50 * 1024 * 1024
    
    # Allowed MIME types
    allowed-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/jpg
      - application/dicom
      - application/x-dicom

# ==============================
# 📊 Logging
# ==============================
# ⚠️ SECURITY: Never log credentials or secrets
# Use INFO for security in production to avoid credential leakage
logging:
  level:
    com.waad.tba: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_HIBERNATE_BINDER:WARN}
    org.hibernate.type.descriptor.sql: ${LOG_LEVEL_HIBERNATE_TYPES:WARN}
